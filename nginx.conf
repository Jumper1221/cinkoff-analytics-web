server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # хе-ши-ров-ан-ные-асс-еты —-веч-ный-кэш
  location /v2/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA-в-2: лю-бой-не-асс-ет-ный-путь → index.html (vue-router-история)
  location /v2/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /v2/index.html;
  }

  # API-прок-си на-бэк-енд (больш-и-е-CSV-—-тер-п-ели-вый-т-ай-м-а-ут)
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location = /healthz { proxy_pass http://backend:8000; }

  # всё-ост-ал-ьно-е —-лег-аси-SPA/FastAPI-стра-ниц-ы-сил-ам-и-бэк-енд-а
  location / {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
